<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMSAM | Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card animate-fade">
            <div class="auth-header">
                <div class="brand" style="justify-content: center; margin-bottom: 1rem;">
                    <h1 class="brand-name">SMSAM</h1>
                </div>
                <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Welcome Back</h2>
                <p style="color: var(--text-dim);">Enter your credentials to access the system</p>
            </div>

            <form method="POST">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-input" placeholder="admin@smsam.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-input" placeholder="••••••••" required>
                </div>
                
                <div style="display: flex; justify-content: flex-end; margin-bottom: 1.5rem;">
                    <a href="#" style="color: var(--primary); text-decoration: none; font-size: 0.85rem;">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary">Sign In</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="{{ url_for('signup') }}">Create Account</a>
            </div>
        </div>
    </div>
</body>
</html>
